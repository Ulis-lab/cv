<body>
<a href="#cv-sheet" class="sr-only" id="skip">Aller à l'aperçu</a>
<header class="topbar">
  <h1>Créateur de <span>CV</span> <small style="font-size:11px;color:var(--ui-muted);font-weight:600;">Beta 0.5.0</small></h1>
  <span id="etat-auto" class="etat-auto" role="status" aria-live="polite" title="Ton CV est gardé dans ce navigateur, sur cet appareil uniquement. Rien n'est envoyé sur internet."></span>
  <div class="actions">
    <button id="btn-mode" type="button">Passer en mode complet</button>
    <button id="btn-save" title="Télécharge ton CV dans un fichier (.json) pour le garder ou le rouvrir plus tard">Enregistrer un fichier</button>
    <button id="btn-load" title="Rouvre un CV enregistré dans un fichier (.json)">Ouvrir un fichier</button>
    <button id="btn-pptx" class="green">PowerPoint (.pptx)</button>
    <button id="btn-pdf" title="Ouvre l'impression : choisis « Enregistrer au format PDF »">PDF</button>
    <button id="btn-print">Imprimer</button>
    <button id="btn-reset" class="danger" type="button" title="Efface tout le CV (tu pourras annuler pendant quelques secondes)">Effacer tout</button>
    <input type="file" id="load-input" accept="application/json,.json" style="display:none">
  </div>
</header>
<main class="layout" id="main">
  <aside class="form-panel" aria-label="Formulaire du CV">
    <div class="tabs" role="tablist" aria-label="Sections du formulaire">
      <button class="tab active" role="tab" aria-selected="true" aria-controls="tab-remplir" data-tab="remplir">📝 Remplir mon CV</button>
      <button class="tab" role="tab" aria-selected="false" aria-controls="tab-perso" data-tab="perso">🎨 Personnalisation</button>
    </div>
    <div id="tab-remplir" class="tab-content"></div>
    <div id="tab-perso" class="tab-content" style="display:none"></div>
  </aside>
  <section class="preview-panel" aria-label="Aperçu du CV">
    <div class="alerte-page" id="alerte-page" role="status" hidden>⚠ Ton CV dépasse une page, même avec le texte réduit. Raccourcis quelques phrases ou retire une puce pour qu'il tienne sur une seule page.</div>
    <div class="template-bar" id="template-bar"></div>
    <div class="sheet-wrap" id="sheet-wrap"><div class="cv-sheet" id="cv-sheet" role="document" aria-label="Aperçu de ton CV"></div></div>
  </section>
</main>
<nav class="vue-bar" aria-label="Affichage"><button type="button" id="vue-form" aria-pressed="true">📝 Formulaire</button><button type="button" id="vue-apercu" aria-pressed="false">👁 Aperçu</button><button type="button" id="vue-export" aria-pressed="false">📤 Exporter</button></nav>
